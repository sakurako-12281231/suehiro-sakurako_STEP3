<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" concent="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="test.css">
</head>
<body>
 <header>
  <h2>世界一甘いお店</h2>
 </header>
 <div class="sidebar">
   サイドバー
 </div>
 <main>
 <table>
    <tr>
        <th>お名前</th>
        <td><input type="text" style="width:40em;"></td>
    </tr>
    <tr>
        <th>お近くのお店</th>
        <td>
           <select>
               <option>北海道・東北</option>
               <option>関東</option>
               <option>中部</option>
               <option>関西</option>
               <option>中国・四国</option>
               <option>九州・沖縄</option>
           </select> 
        </td>
     </tr>
     <tr>
        <th>電話番号</th>
        <td><input type="text" style="width:40em;"></td>
     </tr>
     <tr>
        <th>メールアドレス</th>
        <td><input type="text" style="width:40em;"></td>
     </tr>
     <tr>
        <th>お問い合わせ種別</th>
        <td>
           <input type="radio" name="kind">商品について
           <input type="radio" name="kind">店舗について
        </td>
     </tr>
     <tr>
        <th>お問い合わせ</th>
        <td><textarea cols="30" rows="5"></textarea></td>         
     </tr>
  </table>
 </main>
 <footer>
 フッター
 </footer>
<br>
<button>送信</button>

</body>
</html>
